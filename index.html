<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>隨手記帳 · CWMoney 風</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b; /* CWMoney 暖橘金主色調 */
      --accent-soft: rgba(245, 158, 11, 0.16);
      --expense: #f87171;
      --income: #4ade80;
      --border: rgba(148, 163, 184, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 56px;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 14px; }

    /* 頂部標題列 */
    header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin-bottom: 12px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-badge {
      background: var(--accent); color: #1c1917; font-weight: 800;
      font-size: 0.78rem; padding: 3px 8px; border-radius: 999px;
    }
    h1 { font-size: 1.2rem; margin: 0; }
    .today-pill {
      font-size: 0.8rem; color: var(--muted); background: var(--card);
      border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px;
    }

    /* 週 / 月 / 年 切換 */
    .period-bar {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-bottom: 10px;
    }
    .period-btn {
      padding: 8px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--muted); font-weight: 700; cursor: pointer;
    }
    .period-btn.active {
      background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
    }

    /* 區間選擇器 */
    .selector-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-bottom: 12px; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 12px;
    }
    .range-text { font-size: 0.82rem; color: var(--muted); text-align: right; }
    .picker-input {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 10px; font-size: 0.9rem; width: auto;
    }

    /* CWMoney 風格收支總覽卡 */
    .summary-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }
    .summary-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center;
    }
    .stat-box {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 8px;
    }
    .stat-label { font-size: 0.76rem; color: var(--muted); }
    .stat-val { font-size: 1.04rem; font-weight: 800; margin-top: 4px; }
    .expense-text { color: var(--expense); }
    .income-text { color: var(--income); }
    .ratio-bar {
      height: 7px; border-radius: 999px; background: var(--bg);
      overflow: hidden; margin-top: 12px; border: 1px solid var(--border);
    }
    .ratio-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--expense));
      transition: width 0.25s ease;
    }
    .ratio-caption {
      display: flex; justify-content: space-between; font-size: 0.75rem;
      color: var(--muted); margin-top: 6px;
    }

    /* 分類快捷方塊（六大分類） */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }
    .section-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .section-title { font-weight: 700; font-size: 0.96rem; }
    .section-sub { font-size: 0.78rem; color: var(--muted); }
    .cat-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .cat-tile {
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px; text-align: left; cursor: pointer; color: var(--text);
      transition: border-color 0.15s ease, transform 0.12s ease;
    }
    .cat-tile:active { transform: scale(0.98); }
    .cat-tile.selected {
      border-color: var(--accent); background: var(--accent-soft);
    }
    .cat-top { display: flex; justify-content: space-between; align-items: center; }
    .cat-name { font-weight: 700; font-size: 0.9rem; }
    .cat-pct { font-size: 0.74rem; color: var(--muted); }
    .cat-amt { font-size: 0.88rem; font-weight: 700; color: var(--expense); margin-top: 6px; }

    /* 記帳輸入區 */
    .type-toggle {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
    }
    .type-btn {
      padding: 9px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--muted); font-weight: 700; cursor: pointer;
    }
    .type-btn.active-expense {
      background: rgba(248, 113, 113, 0.16); border-color: var(--expense); color: var(--expense);
    }
    .type-btn.active-income {
      background: rgba(74, 222, 128, 0.16); border-color: var(--income); color: var(--income);
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    input, select, button {
      width: 100%; border-radius: 10px; border: 1px solid var(--border);
      padding: 10px 12px; font-size: 0.95rem; background: var(--bg); color: var(--text);
    }
    .form-actions { display: flex; gap: 8px; margin-top: 12px; }
    button.primary {
      background: var(--accent); color: #1c1917; font-weight: 800;
      border: none; cursor: pointer; flex: 1;
    }
    button.ghost {
      background: var(--card-2); color: var(--text); border: 1px solid var(--border);
      cursor: pointer; width: auto; padding: 10px 14px; font-size: 0.88rem;
    }

    /* 依日期分組的流水帳明細 */
    .day-group { margin-bottom: 12px; }
    .day-group:last-child { margin-bottom: 0; }
    .day-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; background: var(--card-2); border-radius: 8px;
      font-size: 0.8rem; color: var(--muted); margin-bottom: 6px;
    }
    .day-date { font-weight: 700; color: var(--text); }
    .tx-list { display: flex; flex-direction: column; gap: 6px; }
    .tx-item {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; gap: 8px; cursor: pointer;
    }
    .tx-item:hover { border-color: rgba(245, 158, 11, 0.45); }
    .tx-main { min-width: 0; flex: 1; }
    .tx-title { font-weight: 700; font-size: 0.93rem; }
    .tx-meta { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .tx-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .tx-amt { font-weight: 800; font-size: 0.96rem; }
    .del-btn {
      width: auto; padding: 5px 8px; font-size: 0.78rem;
      background: transparent; color: var(--muted); border-color: transparent; cursor: pointer;
    }
    .del-btn:hover { color: var(--expense); }

    .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    button.secondary {
      background: var(--card-2); color: var(--text); border: 1px solid var(--border);
      cursor: pointer; padding: 8px 10px; font-size: 0.85rem;
    }
    .empty { text-align: center; color: var(--muted); padding: 20px 0; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-badge">帳本</span>
        <h1>隨手記帳</h1>
      </div>
      <span id="todayBadge" class="today-pill"></span>
    </header>

    <div class="period-bar">
      <button type="button" class="period-btn" data-period="week">週紀錄</button>
      <button type="button" class="period-btn active" data-period="month">月紀錄</button>
      <button type="button" class="period-btn" data-period="year">年紀錄</button>
    </div>

    <div class="selector-row">
      <div id="periodPickerWrap"></div>
      <span id="periodRangeText" class="range-text"></span>
    </div>

    <section class="summary-card">
      <div class="summary-grid">
        <div class="stat-box">
          <div class="stat-label" id="expLabel">本月支出</div>
          <div class="stat-val expense-text" id="totalExpense">$0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label" id="incLabel">本月收入</div>
          <div class="stat-val income-text" id="totalIncome">$0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label" id="balLabel">本月結餘</div>
          <div class="stat-val" id="totalBalance">$0</div>
        </div>
      </div>
      <div class="ratio-bar"><div class="ratio-fill" id="ratioFill"></div></div>
      <div class="ratio-caption">
        <span>支出佔收入比</span>
        <span id="ratioText">0%</span>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <span class="section-title">分類支出總覽</span>
        <span class="section-sub">點選分類可快速帶入記帳</span>
      </div>
      <div id="catGrid" class="cat-grid"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <span class="section-title" id="formHeading">新增帳目</span>
        <span class="section-sub" id="editHint">每天預設今日日期</span>
      </div>
      <div class="type-toggle">
        <button type="button" id="btnExpense" class="type-btn active-expense">支出</button>
        <button type="button" id="btnIncome" class="type-btn">收入</button>
      </div>
      <form id="txForm">
        <div class="form-grid">
          <div>
            <label for="amount">金額</label>
            <input type="number" id="amount" inputmode="decimal" step="any" min="0.01" placeholder="0" required />
          </div>
          <div>
            <label for="date">日期</label>
            <input type="date" id="date" required />
          </div>
          <div>
            <label for="category">分類</label>
            <select id="category"></select>
          </div>
          <div>
            <label for="account">帳戶</label>
            <select id="account">
              <option value="現金">現金</option>
              <option value="信用卡">信用卡</option>
              <option value="銀行帳戶">銀行帳戶</option>
              <option value="電子支付">電子支付</option>
            </select>
          </div>
          <div class="full">
            <label for="note">備註（選填）</label>
            <input type="text" id="note" placeholder="例如：午餐、捷運、卡費、冷氣維修" />
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="primary" id="submitBtn">儲存帳目</button>
          <button type="button" class="ghost" id="cancelEditBtn" style="display:none;">取消編輯</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="section-head">
        <strong id="listTitle">本月流水明細</strong>
        <span id="countLabel" class="section-sub">0 筆</span>
      </div>
      <div id="txList"></div>
      <div class="tools">
        <button type="button" id="exportBtn" class="secondary">匯出備份 (JSON)</button>
        <button type="button" id="importBtn" class="secondary">匯入備份</button>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none;" />
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'pwa_expense_records_cmoney_v1';
    const CATEGORIES = ['信用卡', '飲食', '日常', '交通', '維修', '其他'];
    const WEEKDAYS = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];

    let currentType = 'expense';
    let currentPeriod = 'month'; // 'week' | 'month' | 'year'
    let editingId = null;
    let records = loadRecords();

    const el = {
      todayBadge: document.getElementById('todayBadge'),
      periodBtns: Array.from(document.querySelectorAll('.period-btn')),
      periodPickerWrap: document.getElementById('periodPickerWrap'),
      periodRangeText: document.getElementById('periodRangeText'),
      expLabel: document.getElementById('expLabel'),
      incLabel: document.getElementById('incLabel'),
      balLabel: document.getElementById('balLabel'),
      ratioFill: document.getElementById('ratioFill'),
      ratioText: document.getElementById('ratioText'),
      catGrid: document.getElementById('catGrid'),
      formHeading: document.getElementById('formHeading'),
      editHint: document.getElementById('editHint'),
      listTitle: document.getElementById('listTitle'),
      btnExpense: document.getElementById('btnExpense'),
      btnIncome: document.getElementById('btnIncome'),
      form: document.getElementById('txForm'),
      amount: document.getElementById('amount'),
      date: document.getElementById('date'),
      category: document.getElementById('category'),
      account: document.getElementById('account'),
      note: document.getElementById('note'),
      submitBtn: document.getElementById('submitBtn'),
      cancelEditBtn: document.getElementById('cancelEditBtn'),
      txList: document.getElementById('txList'),
      countLabel: document.getElementById('countLabel'),
      totalExpense: document.getElementById('totalExpense'),
      totalIncome: document.getElementById('totalIncome'),
      totalBalance: document.getElementById('totalBalance'),
      exportBtn: document.getElementById('exportBtn'),
      importBtn: document.getElementById('importBtn'),
      importFile: document.getElementById('importFile')
    };

    function todayStr() {
      const d = new Date();
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    function parseLocalDate(ymd) {
      const [y, m, d] = ymd.split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function formatYmd(dt) {
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const d = String(dt.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getIsoWeekValue(ymd) {
      const dt = parseLocalDate(ymd);
      const target = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
      const dayNum = target.getUTCDay() || 7;
      target.setUTCDate(target.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(target.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((target - yearStart) / 86400000) + 1) / 7);
      return `${target.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function getWeekRange(weekStr) {
      const match = /^(\d{4})-W(\d{2})$/.exec(weekStr || '');
      if (!match) return { start: '', end: '' };
      const year = Number(match[1]);
      const week = Number(match[2]);
      const jan4 = new Date(Date.UTC(year, 0, 4));
      const jan4Day = jan4.getUTCDay() || 7;
      const mondayUtc = new Date(jan4);
      mondayUtc.setUTCDate(jan4.getUTCDate() - jan4Day + 1 + (week - 1) * 7);
      const sundayUtc = new Date(mondayUtc);
      sundayUtc.setUTCDate(mondayUtc.getUTCDate() + 6);
      const start = new Date(mondayUtc.getUTCFullYear(), mondayUtc.getUTCMonth(), mondayUtc.getUTCDate());
      const end = new Date(sundayUtc.getUTCFullYear(), sundayUtc.getUTCMonth(), sundayUtc.getUTCDate());
      return { start: formatYmd(start), end: formatYmd(end) };
    }

    function loadRecords() {
      try {
        const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(p) ? p : [];
      } catch {
        return [];
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatMoney(n) {
      return '$' + Number(n || 0).toLocaleString('zh-Hant-TW', { maximumFractionDigits: 2 });
    }

    function renderCategories() {
      el.category.innerHTML = CATEGORIES
        .map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`)
        .join('');
    }

    function setType(type) {
      currentType = type;
      el.btnExpense.className = 'type-btn' + (type === 'expense' ? ' active-expense' : '');
      el.btnIncome.className = 'type-btn' + (type === 'income' ? ' active-income' : '');
    }

    function exitEditMode(resetToday = true) {
      editingId = null;
      el.formHeading.textContent = '新增帳目';
      el.editHint.textContent = '每天預設今日日期';
      el.submitBtn.textContent = '儲存帳目';
      el.cancelEditBtn.style.display = 'none';
      el.amount.value = '';
      el.note.value = '';
      if (resetToday) el.date.value = todayStr();
    }

    function startEditRecord(id) {
      const target = records.find(r => r.id === id);
      if (!target) return;
      editingId = target.id;
      setType(target.type === 'income' ? 'income' : 'expense');
      el.amount.value = target.amount;
      el.date.value = target.date || todayStr();
      el.category.value = CATEGORIES.includes(target.category) ? target.category : '其他';
      el.account.value = target.account || '現金';
      el.note.value = target.note || '';
      el.formHeading.textContent = '編輯帳目';
      el.editHint.textContent = '修改後按「更新帳目」';
      el.submitBtn.textContent = '更新帳目';
      el.cancelEditBtn.style.display = 'inline-block';
      el.form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function renderPeriodPicker() {
      const nowYmd = todayStr();
      const nowYear = nowYmd.slice(0, 4);
      const nowMonth = nowYmd.slice(0, 7);
      const nowWeek = getIsoWeekValue(nowYmd);

      if (currentPeriod === 'week') {
        el.periodPickerWrap.innerHTML = `<input type="week" id="periodInput" class="picker-input" value="${nowWeek}" />`;
      } else if (currentPeriod === 'month') {
        el.periodPickerWrap.innerHTML = `<input type="month" id="periodInput" class="picker-input" value="${nowMonth}" />`;
      } else {
        const years = new Set([nowYear]);
        for (const r of records) {
          if (r.date && /^\d{4}/.test(r.date)) years.add(r.date.slice(0, 4));
        }
        const sortedYears = Array.from(years).sort((a, b) => b.localeCompare(a));
        el.periodPickerWrap.innerHTML = `<select id="periodInput" class="picker-input">${
          sortedYears.map(y => `<option value="${y}" ${y === nowYear ? 'selected' : ''}>${y} 年</option>`).join('')
        }</select>`;
      }

      document.getElementById('periodInput').addEventListener('change', render);
    }

    function setPeriod(period) {
      currentPeriod = period;
      for (const btn of el.periodBtns) {
        btn.className = 'period-btn' + (btn.dataset.period === period ? ' active' : '');
      }
      const prefix = period === 'week' ? '本週' : period === 'month' ? '本月' : '本年';
      el.expLabel.textContent = `${prefix}支出`;
      el.incLabel.textContent = `${prefix}收入`;
      el.balLabel.textContent = `${prefix}結餘`;
      el.listTitle.textContent = `${prefix}流水明細`;
      renderPeriodPicker();
      render();
    }

    function filterByCurrentPeriod() {
      const input = document.getElementById('periodInput');
      const val = input ? input.value : '';

      if (currentPeriod === 'week') {
        const { start, end } = getWeekRange(val);
        el.periodRangeText.textContent = start && end ? `${start} ～ ${end}` : '';
        return records.filter(r => r.date && r.date >= start && r.date <= end);
      }

      if (currentPeriod === 'month') {
        el.periodRangeText.textContent = val ? `${val} 月份` : '';
        return records.filter(r => r.date && r.date.startsWith(val));
      }

      el.periodRangeText.textContent = val ? `${val} 年度` : '';
      return records.filter(r => r.date && r.date.startsWith(val));
    }

    function renderCategoryTiles(filtered, totalExp) {
      const catTotals = Object.fromEntries(CATEGORIES.map(c => [c, 0]));
      for (const r of filtered) {
        if (r.type !== 'income') {
          const cat = CATEGORIES.includes(r.category) ? r.category : '其他';
          catTotals[cat] += Number(r.amount) || 0;
        }
      }

      const activeCat = el.category.value;
      el.catGrid.innerHTML = CATEGORIES.map(cat => {
        const amt = catTotals[cat] || 0;
        const pct = totalExp > 0 ? Math.round((amt / totalExp) * 100) : 0;
        const isSel = currentType === 'expense' && activeCat === cat;
        return `
          <button type="button" class="cat-tile ${isSel ? 'selected' : ''}" data-cat="${escapeHtml(cat)}">
            <div class="cat-top">
              <span class="cat-name">${escapeHtml(cat)}</span>
              <span class="cat-pct">${pct}%</span>
            </div>
            <div class="cat-amt">${formatMoney(amt)}</div>
          </button>
        `;
      }).join('');

      for (const tile of el.catGrid.querySelectorAll('.cat-tile')) {
        tile.addEventListener('click', () => {
          setType('expense');
          el.category.value = tile.dataset.cat;
          el.amount.focus();
          renderCategoryTiles(filtered, totalExp);
        });
      }
    }

    function renderGroupedTransactions(filtered) {
      if (!filtered.length) {
        el.txList.innerHTML = '<div class="empty">這個區間還沒有帳目紀錄</div>';
        return;
      }

      const sorted = [...filtered].sort(
        (a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0)
      );

      const groups = new Map();
      for (const r of sorted) {
        const d = r.date || todayStr();
        if (!groups.has(d)) groups.set(d, []);
        groups.get(d).push(r);
      }

      let html = '';
      for (const [ymd, items] of groups.entries()) {
        const dt = parseLocalDate(ymd);
        const wName = WEEKDAYS[dt.getDay()] || '';
        let dayExp = 0;
        let dayInc = 0;
        for (const it of items) {
          const a = Number(it.amount) || 0;
          if (it.type === 'income') dayInc += a;
          else dayExp += a;
        }
        const daySummaryParts = [];
        if (dayExp > 0) daySummaryParts.push(`支 ${formatMoney(dayExp)}`);
        if (dayInc > 0) daySummaryParts.push(`收 ${formatMoney(dayInc)}`);

        html += `
          <div class="day-group">
            <div class="day-header">
              <span class="day-date">${escapeHtml(ymd)}（${wName}）</span>
              <span>${daySummaryParts.join(' · ') || '$0'}</span>
            </div>
            <div class="tx-list">
              ${items.map(r => {
                const isInc = r.type === 'income';
                const cat = CATEGORIES.includes(r.category) ? r.category : '其他';
                return `
                  <div class="tx-item" data-edit-id="${escapeHtml(r.id)}" title="點擊編輯">
                    <div class="tx-main">
                      <div class="tx-title">${escapeHtml(cat)}${r.note ? ' · ' + escapeHtml(r.note) : ''}</div>
                      <div class="tx-meta">${escapeHtml(r.account || '現金')}</div>
                    </div>
                    <div class="tx-right">
                      <div class="tx-amt ${isInc ? 'income-text' : 'expense-text'}">
                        ${isInc ? '+' : '-'}${formatMoney(r.amount)}
                      </div>
                      <button type="button" class="del-btn" data-del-id="${escapeHtml(r.id)}" title="刪除">✕</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      el.txList.innerHTML = html;
    }

    function render() {
      const filtered = filterByCurrentPeriod();

      let exp = 0;
      let inc = 0;
      for (const r of filtered) {
        const amt = Number(r.amount) || 0;
        if (r.type === 'income') inc += amt;
        else exp += amt;
      }
      const bal = inc - exp;
      const ratio = inc > 0 ? Math.min(999, Math.round((exp / inc) * 100)) : (exp > 0 ? 100 : 0);

      el.totalExpense.textContent = formatMoney(exp);
      el.totalIncome.textContent = formatMoney(inc);
      el.totalBalance.textContent = (bal < 0 ? '-' : '') + formatMoney(Math.abs(bal));
      el.totalBalance.className = 'stat-val ' + (bal < 0 ? 'expense-text' : bal > 0 ? 'income-text' : '');
      el.ratioFill.style.width = `${Math.min(100, ratio)}%`;
      el.ratioText.textContent = `${ratio}%`;
      el.countLabel.textContent = `${filtered.length} 筆`;

      renderCategoryTiles(filtered, exp);
      renderGroupedTransactions(filtered);
    }

    el.btnExpense.addEventListener('click', () => {
      setType('expense');
      render();
    });
    el.btnIncome.addEventListener('click', () => {
      setType('income');
      render();
    });
    el.category.addEventListener('change', render);
    el.cancelEditBtn.addEventListener('click', () => exitEditMode(true));

    for (const btn of el.periodBtns) {
      btn.addEventListener('click', () => setPeriod(btn.dataset.period));
    }

    el.form.addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = parseFloat(el.amount.value);
      if (!amount || amount <= 0) return;

      const payload = {
        type: currentType,
        amount,
        date: el.date.value || todayStr(),
        category: CATEGORIES.includes(el.category.value) ? el.category.value : '其他',
        account: el.account.value,
        note: el.note.value.trim()
      };

      if (editingId) {
        records = records.map(r => (r.id === editingId ? { ...r, ...payload } : r));
      } else {
        records.push({
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
          ...payload,
          createdAt: Date.now()
        });
      }

      saveRecords();
      exitEditMode(true);
      el.amount.focus();
      if (currentPeriod === 'year') renderPeriodPicker();
      render();
    });

    el.txList.addEventListener('click', (e) => {
      const delBtn = e.target.closest('[data-del-id]');
      if (delBtn) {
        e.stopPropagation();
        const id = delBtn.getAttribute('data-del-id');
        records = records.filter(r => r.id !== id);
        if (editingId === id) exitEditMode(true);
        saveRecords();
        render();
        return;
      }

      const item = e.target.closest('[data-edit-id]');
      if (item) {
        startEditRecord(item.getAttribute('data-edit-id'));
      }
    });

    el.exportBtn.addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = `expense-cmoney-backup-${todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    el.importBtn.addEventListener('click', () => el.importFile.click());
    el.importFile.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data)) throw new Error();
        const map = new Map(records.map(i => [i.id, i]));
        for (const item of data) if (item && item.id) map.set(item.id, item);
        records = Array.from(map.values());
        saveRecords();
        if (currentPeriod === 'year') renderPeriodPicker();
        render();
        alert('備份匯入完成！');
      } catch {
        alert('匯入失敗，請確認選擇的是正確的 JSON 備份檔。');
      } finally {
        e.target.value = '';
      }
    });

    const nowDate = todayStr();
    const nowDt = parseLocalDate(nowDate);
    el.todayBadge.textContent = `今天 ${nowDate}（${WEEKDAYS[nowDt.getDay()]}）`;
    el.date.value = nowDate;
    renderCategories();
    setType('expense');
    setPeriod('month');
  </script>
</body>
</html>
