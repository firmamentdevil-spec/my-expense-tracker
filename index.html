<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>隨手記帳</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.16);
      --expense: #f87171;
      --border: rgba(148, 163, 184, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 78px;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 14px; }

    /* 第一行：品牌與今日日期 */
    header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin-bottom: 10px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-badge {
      background: var(--accent); color: #1c1917; font-weight: 800;
      font-size: 0.78rem; padding: 3px 8px; border-radius: 999px;
    }
    h1 { font-size: 1.2rem; margin: 0; }
    .today-pill {
      font-size: 0.8rem; color: var(--muted); background: var(--card);
      border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px;
    }

    /* 第二行：左邊小一點顯示當月 + 右邊美化下拉選單 */
    .cal-strip-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 10px 12px; margin-bottom: 12px;
    }
    .month-select-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin-bottom: 10px;
    }
    .current-month-btn {
      width: auto; padding: 5px 10px; border-radius: 999px;
      background: var(--card-2); color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.45);
      font-size: 0.78rem; font-weight: 800; cursor: pointer;
      white-space: nowrap;
    }
    .current-month-btn:active { background: var(--accent); color: #1c1917; }

    .month-dropdown-wrap {
      position: relative; flex: 1; max-width: 190px;
    }
    .month-dropdown {
      width: 100%; appearance: none; -webkit-appearance: none;
      background: var(--bg); color: var(--text);
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-radius: 10px; padding: 7px 32px 7px 12px;
      font-size: 0.88rem; font-weight: 700; cursor: pointer;
    }
    .month-dropdown:focus { outline: none; border-color: var(--accent); }
    .dropdown-arrow {
      position: pointer-events; pointer-events: none;
      position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
      color: var(--accent); font-size: 0.72rem; font-weight: 800;
    }

    .week-row-top {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
      text-align: center; margin-bottom: 6px;
    }
    .wk-head {
      font-size: 0.78rem; font-weight: 700; color: var(--muted);
      padding: 2px 0;
    }
    .week-row-days {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
      text-align: center;
    }
    .day-btn {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.86rem; font-weight: 700;
      padding: 7px 2px; cursor: pointer; width: 100%;
    }
    .day-btn.active {
      border-color: var(--accent); background: var(--accent-soft); color: var(--accent);
    }
    .cal-strip-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 8px; font-size: 0.76rem; color: var(--muted);
    }
    .clear-day-btn {
      width: auto; padding: 3px 8px; font-size: 0.74rem; border-radius: 6px;
      background: var(--card-2); border: 1px solid var(--border); color: var(--text); cursor: pointer;
    }

    /* 月支出 */
    .hero-expense {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .hero-label { font-size: 0.92rem; font-weight: 700; color: var(--text); }
    .hero-sub { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .hero-val { font-size: 1.55rem; font-weight: 800; color: var(--expense); }

    /* 卡片與分類 */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }
    .section-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .section-title { font-weight: 700; font-size: 0.96rem; }
    .section-sub { font-size: 0.78rem; color: var(--muted); }
    .cat-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .cat-tile {
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px; text-align: left; cursor: pointer; color: var(--text);
    }
    .cat-tile.selected {
      border-color: var(--accent); background: var(--accent-soft);
    }
    .cat-top { display: flex; justify-content: space-between; align-items: center; }
    .cat-name { font-weight: 700; font-size: 0.9rem; }
    .cat-pct { font-size: 0.74rem; color: var(--muted); }
    .cat-amt { font-size: 0.88rem; font-weight: 700; color: var(--expense); margin-top: 6px; }

    /* 記帳表單 */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    input, select, button {
      width: 100%; border-radius: 10px; border: 1px solid var(--border);
      padding: 10px 12px; font-size: 0.95rem; background: var(--bg); color: var(--text);
    }
    .form-actions { display: flex; gap: 8px; margin-top: 12px; }
    button.primary {
      background: var(--accent); color: #1c1917; font-weight: 800;
      border: none; cursor: pointer; flex: 1;
    }
    button.ghost {
      background: var(--card-2); color: var(--text); border: 1px solid var(--border);
      cursor: pointer; width: auto; padding: 10px 14px; font-size: 0.88rem;
    }

    /* 日期群組流水帳 */
    .day-group { margin-bottom: 12px; }
    .day-group:last-child { margin-bottom: 0; }
    .day-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; background: var(--card-2); border-radius: 8px;
      font-size: 0.8rem; color: var(--muted); margin-bottom: 6px;
    }
    .day-date-badge {
      display: inline-flex; align-items: baseline; gap: 6px;
      color: var(--text); font-weight: 700;
    }
    .day-md { font-size: 0.92rem; }
    .day-wk { font-size: 0.78rem; color: var(--accent); }
    .day-sum { font-weight: 700; color: var(--expense); }

    .tx-list { display: flex; flex-direction: column; gap: 6px; }
    .tx-item {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; gap: 8px; cursor: pointer;
    }
    .tx-item:hover { border-color: rgba(245, 158, 11, 0.45); }
    .tx-main { min-width: 0; flex: 1; }
    .tx-title { font-weight: 700; font-size: 0.93rem; }
    .tx-meta { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .tx-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .tx-amt { font-weight: 800; font-size: 0.96rem; color: var(--expense); }
    .del-btn {
      width: auto; padding: 5px 8px; font-size: 0.78rem;
      background: transparent; color: var(--muted); border-color: transparent; cursor: pointer;
    }
    .del-btn:hover { color: var(--expense); }

    /* 下方：本週 / 本月 / 本年 結餘排列 */
    .bottom-summary {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }
    .bottom-title {
      font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: var(--text);
    }
    .bottom-list {
      display: flex; flex-direction: column; gap: 8px;
    }
    .bottom-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
    }
    .bottom-row-label { font-size: 0.9rem; font-weight: 700; }
    .bottom-row-val { font-size: 1rem; font-weight: 800; color: var(--text); }

    /* 報表頁樣式 */
    .report-select-box {
      position: relative; margin-bottom: 12px;
    }
    .report-select {
      appearance: none; -webkit-appearance: none;
      background: var(--bg); color: var(--text);
      border: 1px solid rgba(245, 158, 11, 0.55);
      border-radius: 12px; padding: 11px 36px 11px 14px;
      font-size: 0.95rem; font-weight: 700; cursor: pointer;
    }
    .report-select:focus { outline: none; border-color: var(--accent); }
    .report-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 12px; margin-bottom: 8px;
    }
    .report-row:last-child { margin-bottom: 0; }
    .report-row-left { font-weight: 700; font-size: 0.92rem; }
    .report-row-sub { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .report-row-amt { font-weight: 800; font-size: 0.98rem; color: var(--expense); }

    .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    button.secondary {
      background: var(--card-2); color: var(--text); border: 1px solid var(--border);
      cursor: pointer; padding: 8px 10px; font-size: 0.85rem;
    }
    .empty { text-align: center; color: var(--muted); padding: 20px 0; font-size: 0.9rem; }

    /* 最下方兩個工具欄：首頁 / 報表 */
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 8px 14px;
    }
    .bottom-nav-inner {
      max-width: 640px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .nav-tab-btn {
      padding: 9px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--muted); font-size: 0.92rem; font-weight: 800;
      cursor: pointer;
    }
    .nav-tab-btn.active {
      background: var(--accent); color: #1c1917; border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 第一行 -->
    <header>
      <div class="brand">
        <span class="brand-badge">帳本</span>
        <h1>隨手記帳</h1>
      </div>
      <span id="todayBadge" class="today-pill"></span>
    </header>

    <!-- 第二行：左邊小一點顯示當月 + 右邊美化下拉選單 -->
    <section class="cal-strip-card">
      <div class="month-select-row">
        <button type="button" id="currentMonthBtn" class="current-month-btn">當月</button>
        <div class="month-dropdown-wrap">
          <select id="monthSelect" class="month-dropdown" aria-label="選擇月份"></select>
          <span class="dropdown-arrow">▼</span>
        </div>
      </div>
      <div class="week-row-top">
        <div class="wk-head">周日</div>
        <div class="wk-head">周一</div>
        <div class="wk-head">周二</div>
        <div class="wk-head">周三</div>
        <div class="wk-head">周四</div>
        <div class="wk-head">周五</div>
        <div class="wk-head">周六</div>
      </div>
      <div id="weekDaysRow" class="week-row-days"></div>
      <div class="cal-strip-footer">
        <span id="dayFilterStatus">顯示整月明細（點上方日期可看當日）</span>
        <button type="button" id="clearDayBtn" class="clear-day-btn" style="display:none;">看整月</button>
      </div>
    </section>

    <!-- 首頁內容 -->
    <div id="homeView">
      <section class="hero-expense">
        <div>
          <div class="hero-label" id="expTitleLabel">月支出</div>
          <div class="hero-sub" id="expSubLabel">僅計算支出金額</div>
        </div>
        <div class="hero-val" id="totalExpense">$0</div>
      </section>

      <section class="card">
        <div class="section-head">
          <span class="section-title">分類支出</span>
          <span class="section-sub">點選分類可快速帶入</span>
        </div>
        <div id="catGrid" class="cat-grid"></div>
      </section>

      <section class="card">
        <div class="section-head">
          <span class="section-title" id="formHeading">新增支出</span>
          <span class="section-sub" id="editHint">每天預設今日日期</span>
        </div>
        <form id="txForm">
          <div class="form-grid">
            <div>
              <label for="amount">金額</label>
              <input type="number" id="amount" inputmode="decimal" step="any" min="0.01" placeholder="0" required />
            </div>
            <div>
              <label for="date">日期</label>
              <input type="date" id="date" required />
            </div>
            <div>
              <label for="category">分類</label>
              <select id="category"></select>
            </div>
            <div>
              <label for="account">帳戶</label>
              <select id="account">
                <option value="現金">現金</option>
                <option value="信用卡">信用卡</option>
                <option value="銀行帳戶">銀行帳戶</option>
                <option value="電子支付">電子支付</option>
              </select>
            </div>
            <div class="full">
              <label for="note">備註（選填）</label>
              <input type="text" id="note" placeholder="例如：午餐、捷運、卡費、冷氣維修" />
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary" id="submitBtn">儲存支出</button>
            <button type="button" class="ghost" id="cancelEditBtn" style="display:none;">取消編輯</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="section-head">
          <strong id="listHeading">本月明細</strong>
          <span id="countLabel" class="section-sub">0 筆</span>
        </div>
        <div id="txList"></div>
      </section>

      <!-- 下方：本週 / 本月 / 本年 結餘排列 -->
      <section class="bottom-summary">
        <div class="bottom-title">期間結餘總覽</div>
        <div class="bottom-list">
          <div class="bottom-row">
            <span class="bottom-row-label">本週 結餘</span>
            <span class="bottom-row-val" id="weekBalance">$0</span>
          </div>
          <div class="bottom-row">
            <span class="bottom-row-label">本月 結餘</span>
            <span class="bottom-row-val" id="monthBalance">$0</span>
          </div>
          <div class="bottom-row">
            <span class="bottom-row-label">本年 結餘</span>
            <span class="bottom-row-val" id="yearBalance">$0</span>
          </div>
        </div>
      </section>

      <div class="tools">
        <button type="button" id="exportBtn" class="secondary">匯出備份 (JSON)</button>
        <button type="button" id="importBtn" class="secondary">匯入備份</button>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none;" />
      </div>
    </div>

    <!-- 報表內容：先拉報表選單（月分類、月支出、日支出） -->
    <div id="reportView" style="display:none;">
      <section class="card">
        <div class="section-head">
          <span class="section-title">報表查詢</span>
          <span id="reportMonthLabel" class="section-sub"></span>
        </div>
        <div class="report-select-box">
          <select id="reportTypeSelect" class="report-select" aria-label="選擇報表類型">
            <option value="monthCategory">月分類</option>
            <option value="monthExpense">月支出</option>
            <option value="dayExpense">日支出</option>
          </select>
          <span class="dropdown-arrow">▼</span>
        </div>
        <div id="reportBody"></div>
      </section>
    </div>
  </div>

  <!-- 最下方兩個工具欄：首頁 跟 報表 -->
  <nav class="bottom-nav" aria-label="主工具欄">
    <div class="bottom-nav-inner">
      <button type="button" id="tabHome" class="nav-tab-btn active">首頁</button>
      <button type="button" id="tabReport" class="nav-tab-btn">報表</button>
    </div>
  </nav>

  <script>
    const STORAGE_KEY = 'pwa_expense_cw_v4';
    const CATEGORIES = ['信用卡', '飲食', '日常', '交通', '維修', '其他'];
    const WEEKDAYS_SHORT = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

    let currentTab = 'home'; // 'home' | 'report'
    let selectedYmd = null;
    let editingId = null;
    let records = loadRecords();

    const el = {
      todayBadge: document.getElementById('todayBadge'),
      currentMonthBtn: document.getElementById('currentMonthBtn'),
      monthSelect: document.getElementById('monthSelect'),
      weekDaysRow: document.getElementById('weekDaysRow'),
      dayFilterStatus: document.getElementById('dayFilterStatus'),
      clearDayBtn: document.getElementById('clearDayBtn'),
      homeView: document.getElementById('homeView'),
      reportView: document.getElementById('reportView'),
      tabHome: document.getElementById('tabHome'),
      tabReport: document.getElementById('tabReport'),
      reportTypeSelect: document.getElementById('reportTypeSelect'),
      reportMonthLabel: document.getElementById('reportMonthLabel'),
      reportBody: document.getElementById('reportBody'),
      expTitleLabel: document.getElementById('expTitleLabel'),
      expSubLabel: document.getElementById('expSubLabel'),
      listHeading: document.getElementById('listHeading'),
      totalExpense: document.getElementById('totalExpense'),
      catGrid: document.getElementById('catGrid'),
      formHeading: document.getElementById('formHeading'),
      editHint: document.getElementById('editHint'),
      form: document.getElementById('txForm'),
      amount: document.getElementById('amount'),
      date: document.getElementById('date'),
      category: document.getElementById('category'),
      account: document.getElementById('account'),
      note: document.getElementById('note'),
      submitBtn: document.getElementById('submitBtn'),
      cancelEditBtn: document.getElementById('cancelEditBtn'),
      txList: document.getElementById('txList'),
      countLabel: document.getElementById('countLabel'),
      weekBalance: document.getElementById('weekBalance'),
      monthBalance: document.getElementById('monthBalance'),
      yearBalance: document.getElementById('yearBalance'),
      exportBtn: document.getElementById('exportBtn'),
      importBtn: document.getElementById('importBtn'),
      importFile: document.getElementById('importFile')
    };

    function todayStr() {
      const d = new Date();
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    function parseLocalDate(ymd) {
      const [y, m, d] = ymd.split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function formatYmd(dt) {
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const d = String(dt.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatMonthDay(ymd) {
      const [, m, d] = (ymd || todayStr()).split('-');
      return `${Number(m)}/${Number(d)}`;
    }

    function shiftYearMonth(ymStr, deltaMonths) {
      const base = /^\d{4}-\d{2}$/.test(ymStr) ? ymStr : todayStr().slice(0, 7);
      const [y, m] = base.split('-').map(Number);
      const dt = new Date(y, (m || 1) - 1 + deltaMonths, 1);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
    }

    function buildMonthOptions(activeYm) {
      const nowYm = todayStr().slice(0, 7);
      const set = new Set([nowYm]);
      for (let i = -12; i <= 3; i++) {
        set.add(shiftYearMonth(nowYm, i));
      }
      for (const r of records) {
        if (r.date && /^\d{4}-\d{2}/.test(r.date)) set.add(r.date.slice(0, 7));
      }
      if (activeYm) set.add(activeYm);

      const sorted = Array.from(set).sort((a, b) => b.localeCompare(a));
      el.monthSelect.innerHTML = sorted.map(ym => {
        const display = ym.replace('-', '/');
        return `<option value="${escapeHtml(ym)}" ${ym === activeYm ? 'selected' : ''}>${escapeHtml(display)}</option>`;
      }).join('');
    }

    function getCurrentWeekRange(baseYmd) {
      const dt = parseLocalDate(baseYmd);
      const sunday = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - dt.getDay());
      const saturday = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate() + 6);
      return { start: formatYmd(sunday), end: formatYmd(saturday) };
    }

    function getWeekStripDays() {
      const ym = el.monthSelect.value || todayStr().slice(0, 7);
      const nowYmd = todayStr();
      const anchorYmd = selectedYmd || (nowYmd.startsWith(ym) ? nowYmd : `${ym}-23`);
      const dt = parseLocalDate(anchorYmd);
      const sunday = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - dt.getDay());
      const arr = [];
      for (let i = 0; i < 7; i++) {
        const dObj = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate() + i);
        arr.push({
          ymd: formatYmd(dObj),
          dayNum: dObj.getDate()
        });
      }
      return arr;
    }

    function loadRecords() {
      try {
        const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(p) ? p : [];
      } catch {
        return [];
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatMoney(n) {
      return '$' + Math.abs(Number(n || 0)).toLocaleString('zh-Hant-TW', { maximumFractionDigits: 2 });
    }

    function renderCategories() {
      el.category.innerHTML = CATEGORIES
        .map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`)
        .join('');
    }

    function renderMonthAndDays() {
      const currentVal = el.monthSelect.value || todayStr().slice(0, 7);
      buildMonthOptions(currentVal);

      const days = getWeekStripDays();
      el.weekDaysRow.innerHTML = days.map(d => {
        const active = selectedYmd === d.ymd;
        return `
          <button type="button" class="day-btn ${active ? 'active' : ''}" data-ymd="${escapeHtml(d.ymd)}">
            ${d.dayNum}
          </button>
        `;
      }).join('');

      if (selectedYmd) {
        const dt = parseLocalDate(selectedYmd);
        el.dayFilterStatus.textContent = `當日明細：${formatMonthDay(selectedYmd)}（${WEEKDAYS_SHORT[dt.getDay()]}）`;
        el.clearDayBtn.style.display = 'inline-block';
      } else {
        el.dayFilterStatus.textContent = '顯示整月明細（點上方日期可看當日）';
        el.clearDayBtn.style.display = 'none';
      }

      for (const btn of el.weekDaysRow.querySelectorAll('.day-btn')) {
        btn.addEventListener('click', () => {
          const clickedYmd = btn.dataset.ymd;
          selectedYmd = selectedYmd === clickedYmd ? null : clickedYmd;
          el.date.value = clickedYmd;
          render();
        });
      }
    }

    function exitEditMode(resetToday = true) {
      editingId = null;
      el.formHeading.textContent = '新增支出';
      el.editHint.textContent = '每天預設今日日期';
      el.submitBtn.textContent = '儲存支出';
      el.cancelEditBtn.style.display = 'none';
      el.amount.value = '';
      el.note.value = '';
      if (resetToday) el.date.value = selectedYmd || todayStr();
    }

    function startEditRecord(id) {
      const target = records.find(r => r.id === id);
      if (!target) return;
      editingId = target.id;
      el.amount.value = target.amount;
      el.date.value = target.date || todayStr();
      el.category.value = CATEGORIES.includes(target.category) ? target.category : '其他';
      el.account.value = target.account || '現金';
      el.note.value = target.note || '';
      el.formHeading.textContent = '編輯支出';
      el.editHint.textContent = '修改後按「更新支出」';
      el.submitBtn.textContent = '更新支出';
      el.cancelEditBtn.style.display = 'inline-block';
      el.form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function sumExpenses(list) {
      let total = 0;
      for (const r of list) total += Number(r.amount) || 0;
      return total;
    }

    function renderBottomBalances() {
      const nowYmd = todayStr();
      const { start, end } = getCurrentWeekRange(nowYmd);
      const weekList = records.filter(r => r.date && r.date >= start && r.date <= end);
      const monthList = records.filter(r => r.date && r.date.startsWith(nowYmd.slice(0, 7)));
      const yearList = records.filter(r => r.date && r.date.startsWith(nowYmd.slice(0, 4)));

      el.weekBalance.textContent = formatMoney(sumExpenses(weekList));
      el.monthBalance.textContent = formatMoney(sumExpenses(monthList));
      el.yearBalance.textContent = formatMoney(sumExpenses(yearList));
    }

    function renderCategoryTiles(filtered, totalExp) {
      const catTotals = Object.fromEntries(CATEGORIES.map(c => [c, 0]));
      for (const r of filtered) {
        const cat = CATEGORIES.includes(r.category) ? r.category : '其他';
        catTotals[cat] += Number(r.amount) || 0;
      }

      const activeCat = el.category.value;
      el.catGrid.innerHTML = CATEGORIES.map(cat => {
        const amt = catTotals[cat] || 0;
        const pct = totalExp > 0 ? Math.round((amt / totalExp) * 100) : 0;
        const isSel = activeCat === cat;
        return `
          <button type="button" class="cat-tile ${isSel ? 'selected' : ''}" data-cat="${escapeHtml(cat)}">
            <div class="cat-top">
              <span class="cat-name">${escapeHtml(cat)}</span>
              <span class="cat-pct">${pct}%</span>
            </div>
            <div class="cat-amt">${formatMoney(amt)}</div>
          </button>
        `;
      }).join('');

      for (const tile of el.catGrid.querySelectorAll('.cat-tile')) {
        tile.addEventListener('click', () => {
          el.category.value = tile.dataset.cat;
          el.amount.focus();
          renderCategoryTiles(filtered, totalExp);
        });
      }
    }

    function renderGroupedTransactions(filtered) {
      if (!filtered.length) {
        el.txList.innerHTML = `<div class="empty">${selectedYmd ? '這一天還沒有支出紀錄' : '這個月份還沒有支出紀錄'}</div>`;
        return;
      }

      const sorted = [...filtered].sort(
        (a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0)
      );

      const groups = new Map();
      for (const r of sorted) {
        const d = r.date || todayStr();
        if (!groups.has(d)) groups.set(d, []);
        groups.get(d).push(r);
      }

      let html = '';
      for (const [ymd, items] of groups.entries()) {
        const dt = parseLocalDate(ymd);
        const md = formatMonthDay(ymd);
        const wk = WEEKDAYS_SHORT[dt.getDay()] || '';
        const dayExp = sumExpenses(items);

        html += `
          <div class="day-group">
            <div class="day-header">
              <span class="day-date-badge">
                <span class="day-md">${escapeHtml(md)}</span>
                <span class="day-wk">${escapeHtml(wk)}</span>
              </span>
              <span class="day-sum">${formatMoney(dayExp)}</span>
            </div>
            <div class="tx-list">
              ${items.map(r => {
                const cat = CATEGORIES.includes(r.category) ? r.category : '其他';
                return `
                  <div class="tx-item" data-edit-id="${escapeHtml(r.id)}" title="點擊編輯">
                    <div class="tx-main">
                      <div class="tx-title">${escapeHtml(cat)}${r.note ? ' · ' + escapeHtml(r.note) : ''}</div>
                      <div class="tx-meta">${escapeHtml(r.account || '現金')}</div>
                    </div>
                    <div class="tx-right">
                      <div class="tx-amt">${formatMoney(r.amount)}</div>
                      <button type="button" class="del-btn" data-del-id="${escapeHtml(r.id)}" title="刪除">✕</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      el.txList.innerHTML = html;
    }

    function renderReport() {
      const ym = el.monthSelect.value || todayStr().slice(0, 7);
      el.reportMonthLabel.textContent = ym.replace('-', '/');
      const type = el.reportTypeSelect.value;

      if (type === 'monthCategory') {
        const monthRecords = records.filter(r => r.date && r.date.startsWith(ym));
        const total = sumExpenses(monthRecords);
        const map = Object.fromEntries(CATEGORIES.map(c => [c, 0]));
        for (const r of monthRecords) {
          const c = CATEGORIES.includes(r.category) ? r.category : '其他';
          map[c] += Number(r.amount) || 0;
        }
        el.reportBody.innerHTML = CATEGORIES.map(c => {
          const amt = map[c] || 0;
          const pct = total > 0 ? Math.round((amt / total) * 100) : 0;
          return `
            <div class="report-row">
              <div>
                <div class="report-row-left">${escapeHtml(c)}</div>
                <div class="report-row-sub">占當月支出 ${pct}%</div>
              </div>
              <div class="report-row-amt">${formatMoney(amt)}</div>
            </div>
          `;
        }).join('');
        return;
      }

      if (type === 'monthExpense') {
        const monthMap = new Map();
        for (const r of records) {
          if (!r.date || !/^\d{4}-\d{2}/.test(r.date)) continue;
          const k = r.date.slice(0, 7);
          monthMap.set(k, (monthMap.get(k) || 0) + (Number(r.amount) || 0));
        }
        if (!monthMap.has(ym)) monthMap.set(ym, 0);
        const rows = Array.from(monthMap.entries()).sort((a, b) => b[0].localeCompare(a[0]));
        el.reportBody.innerHTML = rows.map(([mKey, amt]) => `
          <div class="report-row">
            <div>
              <div class="report-row-left">${escapeHtml(mKey.replace('-', '/'))}</div>
              <div class="report-row-sub">月支出總額</div>
            </div>
            <div class="report-row-amt">${formatMoney(amt)}</div>
          </div>
        `).join('');
        return;
      }

      // dayExpense：當月每日支出
      const monthRecords = records.filter(r => r.date && r.date.startsWith(ym));
      if (!monthRecords.length) {
        el.reportBody.innerHTML = '<div class="empty">這個月份還沒有日支出紀錄</div>';
        return;
      }
      const dayMap = new Map();
      for (const r of monthRecords) {
        const dKey = r.date;
        if (!dayMap.has(dKey)) dayMap.set(dKey, { sum: 0, count: 0 });
        const cur = dayMap.get(dKey);
        cur.sum += Number(r.amount) || 0;
        cur.count += 1;
      }
      const rows = Array.from(dayMap.entries()).sort((a, b) => b[0].localeCompare(a[0]));
      el.reportBody.innerHTML = rows.map(([dKey, info]) => {
        const wk = WEEKDAYS_SHORT[parseLocalDate(dKey).getDay()] || '';
        return `
          <div class="report-row">
            <div>
              <div class="report-row-left">${escapeHtml(formatMonthDay(dKey))}（${escapeHtml(wk)}）</div>
              <div class="report-row-sub">${info.count} 筆支出</div>
            </div>
            <div class="report-row-amt">${formatMoney(info.sum)}</div>
          </div>
        `;
      }).join('');
    }

    function switchTab(tab) {
      currentTab = tab;
      const isHome = tab === 'home';
      el.homeView.style.display = isHome ? 'block' : 'none';
      el.reportView.style.display = isHome ? 'none' : 'block';
      el.tabHome.className = 'nav-tab-btn' + (isHome ? ' active' : '');
      el.tabReport.className = 'nav-tab-btn' + (!isHome ? ' active' : '');
      if (!isHome) renderReport();
    }

    function render() {
      renderMonthAndDays();
      const m = el.monthSelect.value;
      const monthRecords = records.filter(r => !m || (r.date && r.date.startsWith(m)));
      const filtered = selectedYmd
        ? monthRecords.filter(r => r.date === selectedYmd)
        : monthRecords;

      if (selectedYmd) {
        el.expTitleLabel.textContent = `${formatMonthDay(selectedYmd)} 支出`;
        el.expSubLabel.textContent = '當日支出金額';
        el.listHeading.textContent = `${formatMonthDay(selectedYmd)} 明細`;
      } else {
        el.expTitleLabel.textContent = '月支出';
        el.expSubLabel.textContent = '僅計算支出金額';
        el.listHeading.textContent = '本月明細';
      }

      const totalExp = sumExpenses(filtered);
      el.totalExpense.textContent = formatMoney(totalExp);
      el.countLabel.textContent = `${filtered.length} 筆`;

      renderCategoryTiles(filtered, totalExp);
      renderGroupedTransactions(filtered);
      renderBottomBalances();
      if (currentTab === 'report') renderReport();
    }

    el.currentMonthBtn.addEventListener('click', () => {
      el.monthSelect.value = todayStr().slice(0, 7);
      selectedYmd = null;
      render();
    });

    el.monthSelect.addEventListener('change', () => {
      selectedYmd = null;
      render();
    });

    el.clearDayBtn.addEventListener('click', () => {
      selectedYmd = null;
      render();
    });

    el.tabHome.addEventListener('click', () => switchTab('home'));
    el.tabReport.addEventListener('click', () => switchTab('report'));
    el.reportTypeSelect.addEventListener('change', renderReport);

    el.category.addEventListener('change', render);
    el.cancelEditBtn.addEventListener('click', () => exitEditMode(true));

    el.form.addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = Math.abs(parseFloat(el.amount.value));
      if (!amount || amount <= 0) return;

      const payload = {
        type: 'expense',
        amount,
        date: el.date.value || todayStr(),
        category: CATEGORIES.includes(el.category.value) ? el.category.value : '其他',
        account: el.account.value,
        note: el.note.value.trim()
      };

      if (editingId) {
        records = records.map(r => (r.id === editingId ? { ...r, ...payload } : r));
      } else {
        records.push({
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
          ...payload,
          createdAt: Date.now()
        });
      }

      saveRecords();
      exitEditMode(true);
      el.amount.focus();
      render();
    });

    el.txList.addEventListener('click', (e) => {
      const delBtn = e.target.closest('[data-del-id]');
      if (delBtn) {
        e.stopPropagation();
        const id = delBtn.getAttribute('data-del-id');
        records = records.filter(r => r.id !== id);
        if (editingId === id) exitEditMode(true);
        saveRecords();
        render();
        return;
      }

      const item = e.target.closest('[data-edit-id]');
      if (item) {
        startEditRecord(item.getAttribute('data-edit-id'));
      }
    });

    el.exportBtn.addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = `expense-backup-${todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    el.importBtn.addEventListener('click', () => el.importFile.click());
    el.importFile.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data)) throw new Error();
        const map = new Map(records.map(i => [i.id, i]));
        for (const item of data) if (item && item.id) map.set(item.id, item);
        records = Array.from(map.values());
        saveRecords();
        render();
        alert('備份匯入完成！');
      } catch {
        alert('匯入失敗，請確認選擇的是正確的 JSON 備份檔。');
      } finally {
        e.target.value = '';
      }
    });

    const nowDate = todayStr();
    const nowDt = parseLocalDate(nowDate);
    el.todayBadge.textContent = `${formatMonthDay(nowDate)} ${WEEKDAYS_SHORT[nowDt.getDay()]}`;
    el.date.value = nowDate;
    buildMonthOptions(nowDate.slice(0, 7));
    renderCategories();
    render();
  </script>
</body>
</html>
