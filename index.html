<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="隨手記帳" />
  <title>隨手記帳</title>
  <link id="faviconLink" rel="icon" type="image/png" />
  <link id="appleIconLink" rel="apple-touch-icon" />
  <link id="manifestLink" rel="manifest" />
  <style>
    :root {
      --bg: #ffffff;
      --card: #f8fafc;
      --card-2: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #d97706;
      --accent-soft: rgba(217, 119, 6, 0.14);
      --today-bg: rgba(245, 158, 11, 0.22);
      --expense: #dc2626;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(74px + env(safe-area-inset-bottom));
    }
    .container { max-width: 480px; margin: 0 auto; padding: 10px 12px; }

    /* 第一行：圓形肥貓拿 $ 圖示 + 品牌 + 今日日期 */
    header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; margin-bottom: 8px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .app-icon-badge {
      width: 32px; height: 32px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(217, 119, 6, 0.25);
      background: #fef3c7;
    }
    .app-icon-badge img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 { font-size: 1.08rem; margin: 0; color: var(--text); }
    .today-pill {
      font-size: 0.75rem; color: var(--text); background: var(--card);
      border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px;
      white-space: nowrap; font-weight: 600;
    }

    /* 第二行：左邊當月 + 提示文字並排 + 右邊美化下拉選單 */
    .cal-strip-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 9px 10px; margin-bottom: 10px;
    }
    .month-select-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 6px; margin-bottom: 8px;
    }
    .month-left-group {
      display: flex; align-items: center; gap: 6px;
      min-width: 0; flex: 1;
    }
    .current-month-btn {
      width: auto; padding: 4px 9px; border-radius: 999px;
      background: #ffffff; color: var(--accent);
      border: 1px solid rgba(217, 119, 6, 0.55);
      font-size: 0.74rem; font-weight: 800; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .current-month-btn.active-month {
      background: var(--accent); color: #ffffff; border-color: var(--accent);
    }
    .day-filter-inline {
      font-size: 0.68rem; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .month-dropdown-wrap {
      position: relative; width: 102px; flex-shrink: 0;
    }
    .month-dropdown {
      width: 100%; appearance: none; -webkit-appearance: none;
      background: #ffffff; color: var(--text);
      border: 1px solid #cbd5e1;
      border-radius: 8px; padding: 5px 22px 5px 8px;
      font-size: 0.8rem; font-weight: 700; cursor: pointer;
    }
    .month-dropdown:focus { outline: none; border-color: var(--accent); }
    .dropdown-arrow {
      pointer-events: none;
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      color: var(--accent); font-size: 0.66rem; font-weight: 800;
    }

    .week-row-top {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
      text-align: center; margin-bottom: 4px;
    }
    .wk-head {
      font-size: 0.72rem; font-weight: 700; color: var(--muted);
      padding: 2px 0;
    }
    .week-row-days {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
      text-align: center;
    }
    .day-btn {
      background: #ffffff; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.82rem; font-weight: 700;
      padding: 6px 2px; cursor: pointer; width: 100%; min-height: 32px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .day-btn.is-today {
      background: var(--today-bg);
      border-color: var(--accent);
      color: #92400e;
      box-shadow: inset 0 0 0 1px rgba(217, 119, 6, 0.35);
    }
    .day-btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    /* 支出橫幅：預設當日支出為主，點選當月後顯示月支出 */
    .hero-expense {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 14px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px;
    }
    .hero-label { font-size: 0.9rem; font-weight: 700; color: var(--text); white-space: nowrap; }
    .hero-val { font-size: 1.32rem; font-weight: 800; color: var(--expense); white-space: nowrap; }

    /* 卡片與分類 */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 11px 12px; margin-bottom: 10px;
    }
    .section-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .section-title { font-weight: 700; font-size: 0.9rem; }
    .section-sub { font-size: 0.72rem; color: var(--muted); }
    .cat-row-fit {
      display: flex; flex-direction: row; gap: 3px;
      width: 100%; overflow: hidden;
    }
    .cat-mini {
      flex: 1 1 0; min-width: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; background: #ffffff; border: 1px solid var(--border);
      border-radius: 7px; padding: 5px 2px; cursor: pointer; color: var(--text);
    }
    .cat-mini.selected {
      border-color: var(--accent); background: var(--accent-soft);
    }
    .cat-mini-top {
      display: inline-flex; align-items: center; gap: 2px;
      max-width: 100%;
    }
    .cat-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .cat-mini-name {
      font-weight: 700; font-size: 0.64rem; line-height: 1.1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cat-mini-amt {
      font-size: 0.62rem; font-weight: 800; color: var(--expense); line-height: 1.1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
    }

    /* 記帳表單：分類與金額輸入框在同一行 */
    .inline-input-row {
      display: grid; grid-template-columns: 102px 1fr; gap: 8px;
      align-items: start;
    }
    .field-col { min-width: 0; }
    .note-col { margin-top: 8px; }
    label { display: block; font-size: 0.74rem; color: var(--muted); margin-bottom: 3px; }
    input, select, button {
      width: 100%; border-radius: 9px; border: 1px solid #cbd5e1;
      padding: 9px 10px; font-size: 0.9rem; background: #ffffff; color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .amount-field-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 39px;
      width: 100%;
      border-radius: 9px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      padding: 8px 10px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .amount-field-box.amount-active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.2);
    }
    .amount-inline-group {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      font-size: 0.9rem;
      line-height: 1.25;
    }
    .amount-display-text {
      color: var(--text);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .amount-display-text.is-placeholder {
      color: #94a3b8;
      font-weight: 400;
    }
    .custom-caret {
      display: none;
      width: 2px;
      height: 1.05em;
      background: var(--accent);
      border-radius: 1px;
      flex-shrink: 0;
      margin-left: 2px;
      animation: caretBlink 1s steps(1, end) infinite;
    }
    .amount-field-box.amount-active .custom-caret {
      display: inline-block;
    }
    @keyframes caretBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.2);
    }
    .calc-preview {
      font-size: 0.7rem; color: var(--muted); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* 數字鍵盤：預設隱藏，點選金額輸入框時才出現 */
    .numpad-box {
      display: none;
      margin-top: 8px;
      background: #ffffff;
      border: 1px solid rgba(217, 119, 6, 0.45);
      border-radius: 10px;
      padding: 7px;
    }
    .numpad-box.open {
      display: block;
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    .pad-key {
      padding: 8px 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      min-height: 36px;
    }
    .pad-key:active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .pad-key.op-key {
      background: var(--accent-soft);
      color: #b45309;
      border-color: rgba(217, 119, 6, 0.35);
    }
    .pad-key.clr-key {
      background: rgba(220, 38, 38, 0.1);
      color: var(--expense);
      border-color: rgba(220, 38, 38, 0.3);
    }
    .pad-key.del-key {
      background: var(--card-2);
      color: var(--text);
      border-color: #cbd5e1;
    }

    .form-actions { display: flex; gap: 8px; margin-top: 10px; }
    button.primary {
      background: var(--accent); color: #ffffff; font-weight: 800;
      border: none; cursor: pointer; flex: 1; padding: 10px;
    }
    button.ghost {
      background: var(--card-2); color: var(--text); border: 1px solid var(--border);
      cursor: pointer; width: auto; padding: 10px 12px; font-size: 0.84rem;
    }

    /* 日期群組流水帳 */
    .day-group { margin-bottom: 10px; }
    .day-group:last-child { margin-bottom: 0; }
    .day-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 9px; background: var(--card-2); border-radius: 8px;
      font-size: 0.76rem; color: var(--muted); margin-bottom: 5px;
    }
    .day-date-badge {
      display: inline-flex; align-items: baseline; gap: 5px;
      color: var(--text); font-weight: 700;
    }
    .day-md { font-size: 0.86rem; }
    .day-wk { font-size: 0.74rem; color: var(--accent); }
    .day-sum { font-weight: 700; color: var(--expense); }

    .tx-list { display: flex; flex-direction: column; gap: 5px; }
    .tx-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #ffffff; border: 1px solid var(--border);
      border-radius: 9px; padding: 8px 10px; gap: 6px; cursor: pointer;
    }
    .tx-item:active { border-color: var(--accent); }
    .tx-main { min-width: 0; flex: 1; }
    .tx-title {
      font-weight: 700; font-size: 0.86rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tx-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .tx-amt { font-weight: 800; font-size: 0.9rem; color: var(--expense); }
    .del-btn {
      width: auto; padding: 4px 6px; font-size: 0.76rem;
      background: transparent; color: var(--muted); border-color: transparent; cursor: pointer;
    }
    .del-btn:active { color: var(--expense); }

    /* 下方：本週 / 本月 / 本年 結餘排列 */
    .bottom-summary {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 11px 12px; margin-bottom: 10px;
    }
    .bottom-title {
      font-size: 0.86rem; font-weight: 700; margin-bottom: 8px; color: var(--text);
    }
    .bottom-list {
      display: flex; flex-direction: column; gap: 6px;
    }
    .bottom-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #ffffff; border: 1px solid var(--border);
      border-radius: 9px; padding: 8px 10px;
    }
    .bottom-row-label { font-size: 0.84rem; font-weight: 700; }
    .bottom-row-val { font-size: 0.92rem; font-weight: 800; color: var(--text); }

    /* 報表區 */
    .stat-pair {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-bottom: 10px;
    }
    .stat-box {
      background: #ffffff; border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 10px;
    }
    .stat-box-label { font-size: 0.72rem; color: var(--muted); font-weight: 700; }
    .stat-box-val { font-size: 1.02rem; font-weight: 800; color: var(--expense); margin-top: 2px; }

    .report-select-box {
      position: relative; margin-bottom: 12px;
    }
    .report-select {
      appearance: none; -webkit-appearance: none;
      background: #ffffff; color: var(--text);
      border: 1px solid #cbd5e1;
      border-radius: 10px; padding: 9px 32px 9px 12px;
      font-size: 0.88rem; font-weight: 700; cursor: pointer;
    }
    .report-select:focus { outline: none; border-color: var(--accent); }
    .pie-wrap {
      display: flex; flex-direction: column; align-items: center;
      padding: 4px 0 10px;
    }
    .pie-svg {
      width: 210px; height: 210px; overflow: visible;
    }
    .pie-slice-text {
      font-size: 8.5px; font-weight: 800; fill: #0f172a;
      pointer-events: none;
    }
    .pie-center-title {
      font-size: 8.5px; font-weight: 700; fill: var(--muted);
    }
    .pie-center-val {
      font-size: 11px; font-weight: 800; fill: var(--text);
    }
    .legend-list {
      display: flex; flex-direction: column; gap: 6px; margin-top: 4px;
    }
    .legend-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #ffffff; border: 1px solid var(--border);
      border-radius: 9px; padding: 8px 10px;
    }
    .legend-left {
      display: inline-flex; align-items: center; gap: 7px;
      font-weight: 700; font-size: 0.84rem;
    }
    .legend-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .legend-pct {
      font-size: 0.72rem; color: var(--muted); font-weight: 600;
    }
    .legend-amt {
      font-weight: 800; font-size: 0.88rem; color: var(--expense);
    }

    .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    button.secondary {
      background: var(--card-2); color: var(--text); border: 1px solid var(--border);
      cursor: pointer; padding: 8px 10px; font-size: 0.8rem; font-weight: 700;
    }
    .empty { text-align: center; color: var(--muted); padding: 16px 0; font-size: 0.84rem; }

    /* 最下方兩個工具欄：首頁 跟 報表 */
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    }
    .bottom-nav-inner {
      max-width: 480px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .nav-tab-btn {
      padding: 8px 10px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--muted); font-size: 0.88rem; font-weight: 800;
      cursor: pointer;
    }
    .nav-tab-btn.active {
      background: var(--accent); color: #ffffff; border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 第一行：圓形肥貓拿 $ 圖示 + 品牌 + 今日日期 -->
    <header>
      <div class="brand">
        <span id="headerCatIcon" class="app-icon-badge" aria-hidden="true"></span>
        <h1>隨手記帳</h1>
      </div>
      <span id="todayBadge" class="today-pill"></span>
    </header>

    <!-- 第二行：左邊當月 + 提示文字並排 + 右邊美化下拉選單 -->
    <section class="cal-strip-card">
      <div class="month-select-row">
        <div class="month-left-group">
          <button type="button" id="currentMonthBtn" class="current-month-btn">當月</button>
          <span id="dayFilterStatus" class="day-filter-inline">以當日支出為主，點選「當月」顯示月支出</span>
        </div>
        <div class="month-dropdown-wrap">
          <select id="monthSelect" class="month-dropdown" aria-label="選擇月份"></select>
          <span class="dropdown-arrow">▼</span>
        </div>
      </div>
      <div class="week-row-top">
        <div class="wk-head">周日</div>
        <div class="wk-head">周一</div>
        <div class="wk-head">周二</div>
        <div class="wk-head">周三</div>
        <div class="wk-head">周四</div>
        <div class="wk-head">周五</div>
        <div class="wk-head">周六</div>
      </div>
      <div id="weekDaysRow" class="week-row-days"></div>
    </section>

    <!-- 首頁內容 -->
    <div id="homeView">
      <!-- 支出橫幅：預設當日支出為主，點選當月後顯示月支出 -->
      <section class="hero-expense">
        <span class="hero-label" id="expTitleLabel">當日支出</span>
        <span class="hero-val" id="totalExpense">$0</span>
      </section>

      <!-- 分類支出：單行不溢出、縮小字體 -->
      <section class="card">
        <div class="section-head">
          <span class="section-title">分類支出</span>
          <span class="section-sub">點選帶入</span>
        </div>
        <div id="catRow" class="cat-row-fit"></div>
      </section>

      <!-- 新增支出：分類與金額輸入框在同一行，點選金額才出現數字鍵盤，不彈出手機鍵盤 -->
      <section class="card">
        <div class="section-head">
          <span class="section-title" id="formHeading">新增支出</span>
          <span class="section-sub" id="editHint">自動記錄於目前選定日期</span>
        </div>
        <form id="txForm">
          <div class="inline-input-row">
            <div class="field-col">
              <label for="category">分類</label>
              <select id="category"></select>
            </div>
            <div class="field-col">
              <label for="amountBox">金額（點選顯示鍵盤）</label>
              <div id="amountBox" class="amount-field-box" tabindex="0" role="textbox" aria-label="金額">
                <div class="amount-inline-group">
                  <span id="amountDisplayText" class="amount-display-text is-placeholder">0</span>
                  <span id="customCaret" class="custom-caret" aria-hidden="true"></span>
                </div>
              </div>
              <div id="calcPreview" class="calc-preview">計算結果：$0</div>
            </div>
          </div>

          <div id="numpadBox" class="numpad-box" aria-label="加減乘數字鍵盤與刪除">
            <div class="numpad-grid">
              <button type="button" class="pad-key" data-key="7">7</button>
              <button type="button" class="pad-key" data-key="8">8</button>
              <button type="button" class="pad-key" data-key="9">9</button>
              <button type="button" class="pad-key op-key" data-key="+">+</button>

              <button type="button" class="pad-key" data-key="4">4</button>
              <button type="button" class="pad-key" data-key="5">5</button>
              <button type="button" class="pad-key" data-key="6">6</button>
              <button type="button" class="pad-key op-key" data-key="-">-</button>

              <button type="button" class="pad-key" data-key="1">1</button>
              <button type="button" class="pad-key" data-key="2">2</button>
              <button type="button" class="pad-key" data-key="3">3</button>
              <button type="button" class="pad-key op-key" data-key="*">×</button>

              <button type="button" class="pad-key" data-key="0">0</button>
              <button type="button" class="pad-key" data-key=".">.</button>
              <button type="button" class="pad-key clr-key" data-key="C">C</button>
              <button type="button" class="pad-key del-key" data-key="DEL" aria-label="刪除最後一字元">⌫</button>
            </div>
          </div>

          <div class="note-col">
            <label for="note">備註（選填）</label>
            <input type="text" id="note" placeholder="例如：午餐、捷運、卡費、冷氣維修" />
          </div>
          <div class="form-actions">
            <button type="submit" class="primary" id="submitBtn">儲存支出</button>

    let currentTab = 'home'; // 'home' | 'report'

    const el = {

    function syncAmountDisplay() {
      const hasVal = amountExpr.length > 0;
      el.amountDisplayText.textContent = hasVal ? amountExpr : '0';
      el.amountDisplayText.classList.toggle('is-placeholder', !hasVal);
    }

    function setAmountExpr(nextVal) {
      amountExpr = String(nextVal ?? '');
      syncAmountDisplay();
      updateCalcPreview();
    }

    function setNumpadOpen(open) {
      const isOpen = Boolean(open);
      el.numpadBox.classList.toggle('open', isOpen);
      el.amountBox.classList.toggle('amount-active', isOpen);
      syncAmountDisplay();
    }

    function openCustomNumpad() {
      if (document.activeElement && document.activeElement !== el.amountBox && document.activeElement.tagName === 'INPUT') {
        document.activeElement.blur();
      }
      setNumpadOpen(true);
    }

    function createChubbyCatPngDataUrl(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const s = size / 192;
      ctx.save();
      ctx.scale(s, s);

      // 圓形底色
      const bg = ctx.createRadialGradient(68, 58, 12, 96, 96, 96);
      bg.addColorStop(0, '#fde68a');
      bg.addColorStop(1, '#f59e0b');
      ctx.beginPath();
      ctx.arc(96, 96, 96, 0, Math.PI * 2);
      ctx.fillStyle = bg;
      ctx.fill();

      ctx.strokeStyle = '#451a03';
      ctx.lineWidth = 5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      // 左右貓耳
      ctx.beginPath();
      ctx.moveTo(44, 74); ctx.lineTo(36, 34); ctx.lineTo(74, 52); ctx.closePath();
      ctx.fillStyle = '#f97316'; ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(148, 74); ctx.lineTo(156, 34); ctx.lineTo(118, 52); ctx.closePath();
      ctx.fillStyle = '#f97316'; ctx.fill(); ctx.stroke();

      // 耳內粉橘色
      ctx.beginPath();
      ctx.moveTo(49, 65); ctx.lineTo(44, 43); ctx.lineTo(66, 54); ctx.closePath();
      ctx.fillStyle = '#fed7aa'; ctx.fill();

      ctx.beginPath();
      ctx.moveTo(143, 65); ctx.lineTo(148, 43); ctx.lineTo(126, 54); ctx.closePath();
      ctx.fillStyle = '#fed7aa'; ctx.fill();

      // 肥貓身體與肚肚
      ctx.beginPath();
      ctx.ellipse(96, 130, 56, 42, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#fb923c'; ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(96, 138, 35, 26, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#fff7ed'; ctx.fill();

      // 圓胖貓臉
      ctx.beginPath();
      ctx.ellipse(96, 84, 50, 40, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#fb923c'; ctx.fill(); ctx.stroke();

      // 額頭虎斑紋
      ctx.strokeStyle = '#c2410c';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(84, 49); ctx.lineTo(88, 62);
      ctx.moveTo(96, 47); ctx.lineTo(96, 63);
      ctx.moveTo(108, 49); ctx.lineTo(104, 62);
      ctx.stroke();

      // 眼睛與腮紅
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.arc(76, 82, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(116, 82, 6, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(74, 80, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(114, 80, 2.2, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = 'rgba(251, 113, 133, 0.65)';
      ctx.beginPath(); ctx.ellipse(62, 92, 8, 4.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(130, 92, 8, 4.5, 0, 0, Math.PI * 2); ctx.fill();

      // 鼻子與貓嘴
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath(); ctx.moveTo(96, 87); ctx.lineTo(91, 92); ctx.lineTo(101, 92); ctx.closePath(); ctx.fill();

      ctx.strokeStyle = '#451a03';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(88, 96);
      ctx.quadraticCurveTo(92, 101, 96, 96);
      ctx.quadraticCurveTo(100, 101, 104, 96);
      ctx.stroke();

      // 鬍鬚
      ctx.beginPath();
      ctx.moveTo(36, 84); ctx.lineTo(54, 87);
      ctx.moveTo(36, 95); ctx.lineTo(54, 95);
      ctx.moveTo(156, 84); ctx.lineTo(138, 87);
      ctx.moveTo(156, 95); ctx.lineTo(138, 95);
      ctx.stroke();

      // 肥貓拿著的大 $ 金幣
      ctx.strokeStyle = '#451a03';
      ctx.lineWidth = 4.5;
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.arc(108, 136, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#92400e';
      ctx.font = '900 29px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', 108, 138);

      // 左右前爪捧住 $
      ctx.fillStyle = '#fb923c';
      ctx.beginPath(); ctx.ellipse(76, 138, 13, 9.5, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(134, 138, 13, 9.5, 0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      ctx.restore();
      return canvas.toDataURL('image/png');
    }

    function setupChubbyCatAppIcon() {
      const icon192 = createChubbyCatPngDataUrl(192);
      const icon512 = createChubbyCatPngDataUrl(512);

      el.headerCatIcon.innerHTML = `<img src="${icon192}" alt="肥貓拿 $ 圖示" />`;
      el.faviconLink.href = icon192;
      el.appleIconLink.href = icon192;

      const manifestObj = {
        id: './?v=cat-dollar-1',
        name: '隨手記帳',
        short_name: '隨手記帳',
        start_url: './?v=cat-dollar-1',
        scope: './',
        display: 'standalone',
        background_color: '#ffffff',
        theme_color: '#ffffff',
        icons: [
          { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
        ]
      };
      const manifestDataUrl = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
      el.manifestLink.href = manifestDataUrl;
    }

    function todayStr() {
      const d = new Date();
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    function parseLocalDate(ymd) {
      const [y, m, d] = ymd.split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function formatYmd(dt) {
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const d = String(dt.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatMonthDay(ymd) {
      const [, m, d] = (ymd || todayStr()).split('-');
      return `${Number(m)}/${Number(d)}`;
    }

    function shiftYearMonth(ymStr, deltaMonths) {
      const base = /^\d{4}-\d{2}$/.test(ymStr) ? ymStr : todayStr().slice(0, 7);
      const [y, m] = base.split('-').map(Number);
      const dt = new Date(y, (m || 1) - 1 + deltaMonths, 1);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
    }

    function evalMathAmount(rawInput) {
      const cleaned = String(rawInput ?? '')
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/\s+/g, '');
      if (!cleaned) return null;
      if (!/^[0-9+\-*/().]+$/.test(cleaned)) return null;

      let parenDepth = 0;
      for (const ch of cleaned) {
        if (ch === '(') parenDepth++;
        if (ch === ')') parenDepth--;
        if (parenDepth < 0) return null;
      }
      if (parenDepth !== 0) return null;

      try {
        const result = Function(`"use strict"; return (${cleaned});`)();
        if (typeof result !== 'number' || !Number.isFinite(result)) return null;
        return Math.round(result * 100) / 100;
      } catch {
        return null;
      }
    }

    function updateCalcPreview() {
      const val = evalMathAmount(amountExpr);
      if (val === null) {
        el.calcPreview.textContent = amountExpr.trim() ? '算式有誤（如 100+50*2-10）' : '計算結果：$0';
        return;
      }
      el.calcPreview.textContent = `計算結果：${formatMoney(val)}`;
    }

    function buildMonthOptions(activeYm) {
      const nowYm = todayStr().slice(0, 7);
      const set = new Set([nowYm]);
      for (let i = -12; i <= 3; i++) {
        set.add(shiftYearMonth(nowYm, i));
      }
      for (const r of records) {
        if (r.date && /^\d{4}-\d{2}/.test(r.date)) set.add(r.date.slice(0, 7));
      }
      if (activeYm) set.add(activeYm);

      const sorted = Array.from(set).sort((a, b) => b.localeCompare(a));
      el.monthSelect.innerHTML = sorted.map(ym => {
        const display = ym.replace('-', '/');
        return `<option value="${escapeHtml(ym)}" ${ym === activeYm ? 'selected' : ''}>${escapeHtml(display)}</option>`;
      }).join('');
    }

    function getCurrentWeekRange(baseYmd) {
      const dt = parseLocalDate(baseYmd);
      const sunday = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - dt.getDay());
      const saturday = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate() + 6);
      return { start: formatYmd(sunday), end: formatYmd(saturday) };
    }

    function getWeekStripDays() {
      const ym = el.monthSelect.value || todayStr().slice(0, 7);
      const nowYmd = todayStr();
      const anchorYmd = selectedYmd || (nowYmd.startsWith(ym) ? nowYmd : `${ym}-23`);
      const dt = parseLocalDate(anchorYmd);
      const sunday = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - dt.getDay());
      const arr = [];
      for (let i = 0; i < 7; i++) {
        const dObj = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate() + i);
        arr.push({
          ymd: formatYmd(dObj),
          dayNum: dObj.getDate()
        });
      }
      return arr;
    }

    function getTargetRecordDate() {
      if (selectedYmd) return selectedYmd;
      const now = todayStr();
      const ym = el.monthSelect.value || now.slice(0, 7);
      return now.startsWith(ym) ? now : `${ym}-01`;
    }

    function parseJsonArray(raw) {
      try {
        const p = JSON.parse(raw || '[]');
        return Array.isArray(p) ? p : [];
      } catch {
        return [];
      }
    }

    function loadRecords() {
      const rawMain = localStorage.getItem(STORAGE_KEY);
      if (rawMain !== null) {
        return parseJsonArray(rawMain).filter(item => item && item.id);
      }

      if (!localStorage.getItem(MIGRATED_FLAG_KEY)) {
        const map = new Map();
        for (const legacyKey of LEGACY_KEYS) {
          const legacyList = parseJsonArray(localStorage.getItem(legacyKey));
          for (const item of legacyList) {
            if (item && item.id && !map.has(item.id)) {
              map.set(item.id, item);
            }
          }
        }
        const initialList = Array.from(map.values());
        localStorage.setItem(STORAGE_KEY, JSON.stringify(initialList));
        localStorage.setItem(MIGRATED_FLAG_KEY, '1');
        return initialList;
      }

      return [];
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      localStorage.setItem(MIGRATED_FLAG_KEY, '1');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatMoney(n) {
      return '$' + Math.abs(Number(n || 0)).toLocaleString('zh-Hant-TW', { maximumFractionDigits: 2 });
    }

    function renderCategories() {
      el.category.innerHTML = CATEGORIES
        .map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`)
        .join('');
    }

    function renderMonthAndDays() {
      const currentVal = el.monthSelect.value || todayStr().slice(0, 7);
      buildMonthOptions(currentVal);

      const nowYmd = todayStr();
      const days = getWeekStripDays();
      el.weekDaysRow.innerHTML = days.map(d => {
        const isToday = d.ymd === nowYmd;
        const isSelected = !showMonthMode && selectedYmd === d.ymd;
        const cls = [
          'day-btn',
          isToday ? 'is-today' : '',
          isSelected ? 'active' : ''
        ].filter(Boolean).join(' ');
        return `
          <button type="button" class="${cls}" data-ymd="${escapeHtml(d.ymd)}">
            ${d.dayNum}
          </button>
        `;
      }).join('');

      el.currentMonthBtn.classList.toggle('active-month', showMonthMode);

      if (showMonthMode) {
        el.dayFilterStatus.textContent = '目前顯示：月支出（點日期切回當日）';
      } else if (selectedYmd) {
        const dt = parseLocalDate(selectedYmd);
        el.dayFilterStatus.textContent = `當日：${formatMonthDay(selectedYmd)}（${WEEKDAYS_SHORT[dt.getDay()]}）`;
      } else {
        el.dayFilterStatus.textContent = '以當日支出為主，點選「當月」顯示月支出';
      }

      if (!editingId) {
        el.editHint.textContent = `記帳日期：${formatMonthDay(getTargetRecordDate())}`;
      }

      for (const btn of el.weekDaysRow.querySelectorAll('.day-btn')) {
        btn.addEventListener('click', () => {
          showMonthMode = false;
          selectedYmd = btn.dataset.ymd;
          render();
        });
      }
    }

    function exitEditMode() {
      editingId = null;
      el.formHeading.textContent = '新增支出';
      el.editHint.textContent = `記帳日期：${formatMonthDay(getTargetRecordDate())}`;
      el.submitBtn.textContent = '儲存支出';
      el.cancelEditBtn.style.display = 'none';
      setAmountExpr('');
      el.note.value = '';
      setNumpadOpen(false);
    }

    function startEditRecord(id) {
      const target = records.find(r => r.id === id);
      if (!target) return;
      editingId = target.id;
      setAmountExpr(String(target.amount));
      el.category.value = CATEGORIES.includes(target.category) ? target.category : '其他';
      el.note.value = target.note || '';
      el.formHeading.textContent = '編輯支出';
      el.editHint.textContent = `原日期 ${formatMonthDay(target.date || todayStr())} · 修改後按更新`;
      el.submitBtn.textContent = '更新支出';
      el.cancelEditBtn.style.display = 'inline-block';
      openCustomNumpad();
      el.form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function sumExpenses(list) {
      let total = 0;
      for (const r of list) total += Number(r.amount) || 0;
      return total;
    }

    function renderBottomBalances() {
      const nowYmd = todayStr();
      const { start, end } = getCurrentWeekRange(nowYmd);
      const weekList = records.filter(r => r.date && r.date >= start && r.date <= end);
      const monthList = records.filter(r => r.date && r.date.startsWith(nowYmd.slice(0, 7)));
      const yearList = records.filter(r => r.date && r.date.startsWith(nowYmd.slice(0, 4)));

      el.weekBalance.textContent = formatMoney(sumExpenses(weekList));
      el.monthBalance.textContent = formatMoney(sumExpenses(monthList));
      el.yearBalance.textContent = formatMoney(sumExpenses(yearList));
    }

    function renderCategoryRow(targetRecords) {
      const catTotals = Object.fromEntries(CATEGORIES.map(c => [c, 0]));
      for (const r of targetRecords) {
        const cat = CATEGORIES.includes(r.category) ? r.category : '其他';
        catTotals[cat] += Number(r.amount) || 0;
      }

      const activeCat = el.category.value;
      el.catRow.innerHTML = CATEGORIES.map((cat, idx) => {
        const amt = catTotals[cat] || 0;
        const isSel = activeCat === cat;
        const color = PALETTE[idx % PALETTE.length];
        return `
          <button type="button" class="cat-mini ${isSel ? 'selected' : ''}" data-cat="${escapeHtml(cat)}">
            <span class="cat-mini-top">
              <span class="cat-dot" style="background:${color};"></span>
              <span class="cat-mini-name">${escapeHtml(cat)}</span>
            </span>
            <span class="cat-mini-amt">${formatMoney(amt)}</span>
          </button>
        `;
      }).join('');

      for (const btn of el.catRow.querySelectorAll('.cat-mini')) {
        btn.addEventListener('click', () => {
          el.category.value = btn.dataset.cat;
          openCustomNumpad();
          renderCategoryRow(targetRecords);
        });
      }
    }

    function renderGroupedTransactions(filtered) {
      if (!filtered.length) {
        el.txList.innerHTML = `<div class="empty">${showMonthMode ? '這個月份還沒有支出紀錄' : '這一天還沒有支出紀錄'}</div>`;
        return;
      }

      const sorted = [...filtered].sort(
        (a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0)
      );

      const groups = new Map();
      for (const r of sorted) {
        const d = r.date || todayStr();
        if (!groups.has(d)) groups.set(d, []);
        groups.get(d).push(r);
      }

      let html = '';
      for (const [ymd, items] of groups.entries()) {
        const dt = parseLocalDate(ymd);
        const md = formatMonthDay(ymd);
        const wk = WEEKDAYS_SHORT[dt.getDay()] || '';
        const dayExp = sumExpenses(items);

        html += `
          <div class="day-group">
            <div class="day-header">
              <span class="day-date-badge">
                <span class="day-md">${escapeHtml(md)}</span>
                <span class="day-wk">${escapeHtml(wk)}</span>
              </span>
              <span class="day-sum">${formatMoney(dayExp)}</span>
            </div>
            <div class="tx-list">
              ${items.map(r => {
                const cat = CATEGORIES.includes(r.category) ? r.category : '其他';
                return `
                  <div class="tx-item" data-edit-id="${escapeHtml(r.id)}" title="點擊編輯">
                    <div class="tx-main">
                      <div class="tx-title">${escapeHtml(cat)}${r.note ? ' · ' + escapeHtml(r.note) : ''}</div>
                    </div>
                    <div class="tx-right">
                      <div class="tx-amt">${formatMoney(r.amount)}</div>
                      <button type="button" class="del-btn" data-del-id="${escapeHtml(r.id)}" title="刪除">✕</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      el.txList.innerHTML = html;
    }

    function buildPieChartHtml(slices, centerTitle, emptyMsg) {
      const positiveSlices = slices.filter(s => s.value > 0);
      const total = positiveSlices.reduce((acc, s) => acc + s.value, 0);

      if (!positiveSlices.length || total <= 0) {
        return `<div class="empty">${escapeHtml(emptyMsg)}</div>`;
      }

      const cx = 115;
      const cy = 115;
      const r = 92;
      const innerR = 34;
      let startAngle = -Math.PI / 2;
      let pathsHtml = '';
      let labelsHtml = '';

      if (positiveSlices.length === 1) {
        const only = positiveSlices[0];
        pathsHtml = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${only.color}" />`;
        labelsHtml = `<text x="${cx}" y="${cy - 44}" text-anchor="middle" class="pie-slice-text">${escapeHtml(only.label)} 100%</text>`;
      } else {
        for (const s of positiveSlices) {
          const frac = s.value / total;
          const angle = frac * Math.PI * 2;
          const endAngle = startAngle + angle;
          const x1 = cx + r * Math.cos(startAngle);
          const y1 = cy + r * Math.sin(startAngle);
          const x2 = cx + r * Math.cos(endAngle);
          const y2 = cy + r * Math.sin(endAngle);
          const largeArc = angle > Math.PI ? 1 : 0;

          pathsHtml += `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${s.color}" stroke="#ffffff" stroke-width="2" />`;

          const pct = Math.round(frac * 100);
          if (pct >= 7) {
            const midAngle = startAngle + angle / 2;
            const labelR = (r + innerR) / 2 + 4;
            const lx = cx + labelR * Math.cos(midAngle);
            const ly = cy + labelR * Math.sin(midAngle);
            labelsHtml += `
              <text x="${lx.toFixed(1)}" y="${(ly - 3).toFixed(1)}" text-anchor="middle" class="pie-slice-text">${escapeHtml(s.label)}</text>
              <text x="${lx.toFixed(1)}" y="${(ly + 7).toFixed(1)}" text-anchor="middle" class="pie-slice-text">${pct}%</text>
            `;
          }

          startAngle = endAngle;
        }
      }

      const holeHtml = `
        <circle cx="${cx}" cy="${cy}" r="${innerR}" fill="#ffffff" />
        <text x="${cx}" y="${cy - 3}" text-anchor="middle" class="pie-center-title">${escapeHtml(centerTitle)}</text>
        <text x="${cx}" y="${cy + 9}" text-anchor="middle" class="pie-center-val">${escapeHtml(formatMoney(total))}</text>
      `;

      const legendHtml = positiveSlices.map(s => {
        const pct = Math.round((s.value / total) * 100);
        return `
          <div class="legend-row">
            <span class="legend-left">
              <span class="legend-dot" style="background:${s.color};"></span>
              <span>${escapeHtml(s.label)}</span>
              <span class="legend-pct">${pct}%</span>
            </span>
            <span class="legend-amt">${formatMoney(s.value)}</span>
          </div>
        `;
      }).join('');

      return `
        <div class="pie-wrap">
          <svg class="pie-svg" viewBox="0 0 230 230" role="img" aria-label="支出圓餅圖">
            ${pathsHtml}
            ${labelsHtml}
            ${holeHtml}
          </svg>
        </div>
        <div class="legend-list">${legendHtml}</div>
      `;
    }

    function renderReport() {
      const ym = el.monthSelect.value || todayStr().slice(0, 7);
      const targetDay = selectedYmd || (todayStr().startsWith(ym) ? todayStr() : `${ym}-01`);
      const dayRecords = records.filter(r => r.date === targetDay);
      const monthRecords = records.filter(r => r.date && r.date.startsWith(ym));

      el.reportMonthLabel.textContent = ym.replace('-', '/');
      el.reportDayStatLabel.textContent = `日支出統計（${formatMonthDay(targetDay)}）`;
      el.reportDayStatVal.textContent = formatMoney(sumExpenses(dayRecords));
      el.reportMonthStatLabel.textContent = `月支出統計（${ym.replace('-', '/')}）`;
      el.reportMonthStatVal.textContent = formatMoney(sumExpenses(monthRecords));

      const type = el.reportTypeSelect.value;

      if (type === 'monthCategory') {
        const map = Object.fromEntries(CATEGORIES.map(c => [c, 0]));
        for (const r of monthRecords) {
          const c = CATEGORIES.includes(r.category) ? r.category : '其他';
          map[c] += Number(r.amount) || 0;
        }
        const slices = CATEGORIES.map((c, idx) => ({
          label: c,
          value: map[c] || 0,
          color: PALETTE[idx % PALETTE.length]
        }));
        el.reportBody.innerHTML = buildPieChartHtml(slices, '月分類總計', '這個月份還沒有分類支出資料');
        return;
      }

      if (type === 'monthExpense') {
        const monthMap = new Map();
        for (const r of records) {
          if (!r.date || !/^\d{4}-\d{2}/.test(r.date)) continue;
          const k = r.date.slice(0, 7);
          monthMap.set(k, (monthMap.get(k) || 0) + (Number(r.amount) || 0));
        }
        const rows = Array.from(monthMap.entries()).sort((a, b) => b[0].localeCompare(a[0]));
        const slices = rows.map(([mKey, amt], idx) => ({
          label: mKey.replace('-', '/'),
          value: amt,
          color: PALETTE[idx % PALETTE.length]
        }));
        el.reportBody.innerHTML = buildPieChartHtml(slices, '月支出總計', '目前還沒有月支出紀錄');
        return;
      }

      const dayMap = new Map();
      for (const r of monthRecords) {
        const dKey = r.date;
        dayMap.set(dKey, (dayMap.get(dKey) || 0) + (Number(r.amount) || 0));
      }
      const rows = Array.from(dayMap.entries()).sort((a, b) => b[0].localeCompare(a[0]));
      const slices = rows.map(([dKey, amt], idx) => ({
        label: formatMonthDay(dKey),
        value: amt,
        color: PALETTE[idx % PALETTE.length]
      }));
      el.reportBody.innerHTML = buildPieChartHtml(slices, '當月日支出', '這個月份還沒有日支出紀錄');
    }

    function switchTab(tab) {
      currentTab = tab;
      const isHome = tab === 'home';
      el.homeView.style.display = isHome ? 'block' : 'none';
      el.reportView.style.display = isHome ? 'none' : 'block';
      el.tabHome.className = 'nav-tab-btn' + (isHome ? ' active' : '');
      el.tabReport.className = 'nav-tab-btn' + (!isHome ? ' active' : '');
      if (!isHome) {
        setNumpadOpen(false);
        renderReport();
      }
    }

    function render() {
      renderMonthAndDays();
      const m = el.monthSelect.value;
      const monthRecords = records.filter(r => !m || (r.date && r.date.startsWith(m)));
      const activeDay = selectedYmd || (todayStr().startsWith(m) ? todayStr() : `${m}-01`);
      const dayRecords = monthRecords.filter(r => r.date === activeDay);

      if (showMonthMode) {
        el.expTitleLabel.textContent = '月支出';
        el.listHeading.textContent = '本月明細';
        el.totalExpense.textContent = formatMoney(sumExpenses(monthRecords));
        el.countLabel.textContent = `${monthRecords.length} 筆`;
        renderCategoryRow(monthRecords);
        renderGroupedTransactions(monthRecords);
      } else {
        el.expTitleLabel.textContent = `${formatMonthDay(activeDay)} 支出`;
        el.listHeading.textContent = `${formatMonthDay(activeDay)} 明細`;
        el.totalExpense.textContent = formatMoney(sumExpenses(dayRecords));
        el.countLabel.textContent = `${dayRecords.length} 筆`;
        renderCategoryRow(dayRecords);
        renderGroupedTransactions(dayRecords);
      }

      renderBottomBalances();
      if (currentTab === 'report') renderReport();
    }

    // 點選金額框時顯示外框線、隨文字移動的閃爍游標與數字鍵盤，不彈出手機原生鍵盤
    el.amountBox.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      openCustomNumpad();
    });
    el.amountBox.addEventListener('click', (e) => {
      e.preventDefault();
      openCustomNumpad();
    });

    // 點選備註欄時收合數字鍵盤與游標
    el.note.addEventListener('focus', () => setNumpadOpen(false));

    // 點選表單外區域（非金額框與非數字鍵盤）時收合數字鍵盤與游標
    document.addEventListener('click', (e) => {
      if (el.amountBox.contains(e.target) || el.numpadBox.contains(e.target)) return;
      setNumpadOpen(false);
    });

    el.numpadBox.addEventListener('click', (e) => {
      const keyBtn = e.target.closest('[data-key]');
      if (!keyBtn) return;
      const k = keyBtn.getAttribute('data-key');
      if (k === 'C') {
        setAmountExpr('');
      } else if (k === 'DEL') {
        setAmountExpr(amountExpr.slice(0, -1));
      } else {
        setAmountExpr(amountExpr + k);
      }
    });

    el.currentMonthBtn.addEventListener('click', () => {
      el.monthSelect.value = todayStr().slice(0, 7);
      showMonthMode = true;
      render();
    });

    el.monthSelect.addEventListener('change', () => {
      showMonthMode = false;
      const ym = el.monthSelect.value;
      selectedYmd = todayStr().startsWith(ym) ? todayStr() : `${ym}-01`;
      render();
    });

    el.tabHome.addEventListener('click', () => switchTab('home'));
    el.tabReport.addEventListener('click', () => switchTab('report'));
    el.reportTypeSelect.addEventListener('change', renderReport);

    el.category.addEventListener('change', render);
    el.cancelEditBtn.addEventListener('click', exitEditMode);

        });
      }

      saveRecords();
